name: APK Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk YuzTanima.apk

      - name: APK'yı yükle (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: YuzTanima-apk
          path: YuzTanima.apk

      - name: Release olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Yüz Tanıma v1.0.${{ github.run_number }}
          files: YuzTanima.apk

      - name: APK'yı apk dalına koy
        run: |
          mkdir /tmp/apkout && cp YuzTanima.apk /tmp/apkout/
          cd /tmp/apkout
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add YuzTanima.apk
          git commit -q -m "APK v1.0.${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
